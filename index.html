<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ranita</title>
<style>
  :root {
    --bg: #06030f;
    --cyan: #00f5ff;
    --pink: #ff2d78;
    --violet: #9b00ff;
    --yellow: #ffe600;
    --green: #00ff88;
    --orange: #ff6a00;
    --grid: rgba(155,0,255,0.08);
    --road: #111118;
    --water: #030d2a;
    --safe: #0a1a08;
    --home: #0d2b0a;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: #fff;
    font-family: 'Courier New', monospace;
    font-weight: 700;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    position: relative;
    user-select: none;
  }

  /* CRT grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(155,0,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155,0,255,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }

  /* Scanlines */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 50;
  }

  /* ── HEADER ── */
  header {
    width: 100%;
    max-width: 420px;
    padding: 12px 16px 8px;
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: 'Courier New', monospace;
    font-size: 1.1rem;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan), 0 0 30px rgba(0,245,255,0.4);
    letter-spacing: 0.08em;
    line-height: 1.4;
  }

  .logo span { color: var(--pink); text-shadow: 0 0 10px var(--pink); }

  .hud {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }

  .hud-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Courier New', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.05em;
  }

  .hud-label { color: var(--violet); opacity: 0.8; }

  .hud-val {
    color: var(--yellow);
    text-shadow: 0 0 8px var(--yellow);
    min-width: 40px;
    text-align: right;
  }

  .lives-display { display: flex; gap: 3px; }
  .life-icon { font-size: 0.9rem; filter: drop-shadow(0 0 4px var(--green)); }

  /* ── CANVAS WRAPPER ── */
  #canvas-wrap {
    position: relative;
    z-index: 10;
  }

  canvas {
    display: block;
    border: 2px solid var(--violet);
    box-shadow:
      0 0 20px rgba(155,0,255,0.4),
      0 0 60px rgba(155,0,255,0.15),
      inset 0 0 30px rgba(0,0,0,0.5);
    image-rendering: pixelated;
  }

  /* ── OVERLAY (start/gameover/win) ── */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(6,3,15,0.88);
    z-index: 20;
    backdrop-filter: blur(2px);
  }

  #overlay.hidden { display: none; }

  .ov-title {
    font-family: 'Courier New', monospace;
    font-size: 1.7rem;
    letter-spacing: 0.08em;
    text-align: center;
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .ov-title.cyan  { color: var(--cyan);  text-shadow: 0 0 20px var(--cyan); }
  .ov-title.pink  { color: var(--pink);  text-shadow: 0 0 20px var(--pink); }
  .ov-title.green { color: var(--green); text-shadow: 0 0 20px var(--green); }

  .ov-sub {
    font-family: 'Courier New', monospace;
    font-size: 0.62rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.1em;
    text-align: center;
    margin-bottom: 6px;
    line-height: 2;
  }

  .ov-score {
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    color: var(--yellow);
    text-shadow: 0 0 12px var(--yellow);
    margin: 10px 0 18px;
    letter-spacing: 0.1em;
  }

  .ov-btn {
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    background: transparent;
    border: 2px solid var(--cyan);
    color: var(--cyan);
    padding: 12px 24px;
    cursor: pointer;
    text-shadow: 0 0 8px var(--cyan);
    box-shadow: 0 0 14px rgba(0,245,255,0.2);
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .ov-btn:hover {
    background: var(--cyan);
    color: var(--bg);
    text-shadow: none;
    box-shadow: 0 0 24px rgba(0,245,255,0.5);
  }

  /* ── D-PAD (mobile) ── */
  #dpad {
    position: relative;
    z-index: 10;
    padding: 10px 0 16px;
    display: grid;
    grid-template-areas:
      ". up ."
      "left . right"
      ". down .";
    grid-template-columns: 64px 64px 64px;
    grid-template-rows: 64px 64px 64px;
    gap: 4px;
  }

  .dpad-btn {
    background: rgba(155,0,255,0.15);
    border: 1.5px solid rgba(155,0,255,0.4);
    color: var(--violet);
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.08s;
    box-shadow: 0 0 10px rgba(155,0,255,0.1);
  }

  .dpad-btn:active, .dpad-btn.pressed {
    background: rgba(155,0,255,0.4);
    border-color: var(--violet);
    color: #fff;
    box-shadow: 0 0 20px rgba(155,0,255,0.4);
    transform: scale(0.92);
  }

  .dpad-up    { grid-area: up; }
  .dpad-left  { grid-area: left; }
  .dpad-right { grid-area: right; }
  .dpad-down  { grid-area: down; }

  /* Level flash */
  @keyframes levelFlash {
    0%,100% { opacity: 1; }
    50%      { opacity: 0; }
  }

  .flash { animation: levelFlash 0.3s ease 3; }
</style>
</head>
<body>

<header>
  <div class="logo">RAN<span>·</span>ITA</div>
  <div class="hud">
    <div class="hud-row">
      <span class="hud-label">SCORE</span>
      <span class="hud-val" id="score-el">0</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">HI</span>
      <span class="hud-val" id="hi-el">0</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">LVL</span>
      <span class="hud-val" id="level-el">1</span>
    </div>
    <div class="hud-row">
      <div class="lives-display" id="lives-el"></div>
    </div>
  </div>
</header>

<div id="canvas-wrap">
  <canvas id="game" width="390" height="468"></canvas>
  <div id="overlay">
    <div class="ov-title cyan" id="ov-title">RAN<br>ITA</div>
    <div class="ov-sub" id="ov-sub">SALTA Y LLEGA A CASA<br>SANO Y SALVO</div>
    <div class="ov-score" id="ov-score" style="display:none"></div>
    <button class="ov-btn" id="ov-btn" onclick="startGame()">► INICIAR</button>
  </div>
</div>

<div id="dpad">
  <button class="dpad-btn dpad-up"    id="btn-up"    ontouchstart="dpadPress('up')" ontouchend="dpadRelease('up')" onmousedown="dpadPress('up')" onmouseup="dpadRelease('up')">▲</button>
  <button class="dpad-btn dpad-left"  id="btn-left"  ontouchstart="dpadPress('left')" ontouchend="dpadRelease('left')" onmousedown="dpadPress('left')" onmouseup="dpadRelease('left')">◀</button>
  <button class="dpad-btn dpad-right" id="btn-right" ontouchstart="dpadPress('right')" ontouchend="dpadRelease('right')" onmousedown="dpadPress('right')" onmouseup="dpadRelease('right')">▶</button>
  <button class="dpad-btn dpad-down"  id="btn-down"  ontouchstart="dpadPress('down')" ontouchend="dpadRelease('down')" onmousedown="dpadPress('down')" onmouseup="dpadRelease('down')">▼</button>
</div>

let score = 0, hiScore = 0, lives = 3, level = 1;

let deathTimer = 0;
let winTimer = 0;
